/* Claims an Employee ID for this account. Fails if the ID doesn't exist or belongs to someone else. */
async function claimId(id,u,adm){const ref=db.doc('employees/'+id);
 return db.runTransaction(async t=>{const s=await t.get(ref);
  if(!s.exists){/* first-time admin: a verified admin may register their own ID */
   if(!(adm&&u.emailVerified&&/^[A-Z0-9]{8,20}$/.test(id)))throw 'none';
   const si=STARTERS.findIndex((n,i)=>id===BIZ+'2025'+'01'+String(i+1).padStart(2,'0')),nm=si>=0?STARTERS[si]:(u.displayName||(u.email||'').split('@')[0]),now=new Date().toISOString();
   t.set(ref,{name:nm,year:id.slice(3,7),dept:si>=0?'01':'00',uid:u.uid,email:u.email,claimedAt:now,created:now,invite:''});return{name:nm}}
  const d=s.data();
  if(d.uid&&d.uid!==u.uid)throw 'taken';
  if(!d.uid&&d.invite&&d.invite!==(u.email||'').toLowerCase())throw 'mismatch';
  if(!d.uid)t.update(ref,{uid:u.uid,email:u.email,claimedAt:new Date().toISOString()});
  return d})}

  authMsg='';gate=false;await boot(fa.currentUser)
 }catch(x){
  const code=(x&&x.code)||'';
  const m=x==='none'?'That Employee ID doesn’t exist. Please check with your admin.'
   :x==='taken'?'That Employee ID already belongs to another account.'
   :x==='mismatch'?'That Employee ID is reserved for a different email address. Use the email your admin registered.'
   :(typeof x==='string'&&x.startsWith('other:'))?'This account already uses Employee ID '+x.slice(6)+'. Please use that ID.'
   :code==='permission-denied'?'Could not check the Employee ID. Make sure the latest firestore.rules is published.'

   :'Email, password or Employee ID is incorrect.';
  if(mode==='up'&&claimed){try{await db.doc('employees/'+claimed).update({uid:'',email:''})}catch(_){}}
  if(c&&c.user){try{if(mode==='up')await c.user.delete();else await fa.signOut()}catch(_){}}
  gate=false;authMsg=m;user=null;render()}}

function tkSet(k,id,i,f,val){const r=S[k].find(x=>x.id===id);if(!r)return;const a=tkParse(r[TF(k)]);if(!a[i])return;a[i][f]=val;tkWrite(k,r,a,f==='d')}
function tkAdd(k,id){const r=S[k].find(x=>x.id===id);if(!r)return;const a=tkParse(r[TF(k)]);a.push({d:false,t:''});tkWrite(k,r,a,true,true)}
function tkDel(k,id,i){const r=S[k].find(x=>x.id===id);if(!r)return;const a=tkParse(r[TF(k)]);a.splice(i,1);tkWrite(k,r,a,true)}

let tt;function toast(t,lbl,fn){const e=$('#toast');if(!e)return;e.textContent=t;e.style.pointerEvents=lbl?'auto':'none';if(lbl){const b=document.createElement('button');b.textContent=lbl;b.style.cssText='margin-left:12px;background:#fff;color:var(--btn);border:0;border-radius:999px;padding:4px 12px;font:600 13px Archivo,sans-serif;cursor:pointer';b.onclick=()=>{e.classList.remove('on');e.style.pointerEvents='none';fn()};e.appendChild(b)}e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>{e.classList.remove('on');e.style.pointerEvents='none'},lbl?6000:2600)}

/* Save progress: writes every row of this list right now */
async function saveWs(k){const rows=S[k].filter(own);if(!rows.length)return toast('Nothing to save yet.');
 Object.values(tm).forEach(clearTimeout);const now=new Date().toISOString(),me=myName(),ops=[];
 rows.forEach(r=>{const d={by:me,upd:now,savedAt:now};SETS[k].cols.forEach(c=>{d[c[0]]=r[c[0]]??''});if(r.typeOther)d.typeOther=r.typeOther;ops.push(b=>b.set(db.doc(k+'/'+r.id),d,{merge:true}))});
 try{await batchRun(ops);await Promise.all(rows.filter(r=>r.shared).map(r=>syncCollab(k,r.id)));toast('Progress saved.')}catch(e){alert('Could not save: '+e.message)}}

/* Share a row to the Collaboration Space */
function collabData(k,r){return{uid:r.uid,name:myName(),src:k,rowId:r.id,date:r.date||'',type:r.type==='Others'&&r.typeOther?'Others: '+r.typeOther:(r.type||''),platform:r.platform||'',status:r.status||'',person:r.person||'',notes:(k==='plan'?r.remarks:r.notes)||'',items:r[TF(k)]||'',upd:new Date().toISOString()}}
function syncCollab(k,id){const r=S[k].find(x=>x.id===id);if(!r||!r.shared)return Promise.resolve();return db.doc('collab/'+k+'_'+id).update(collabData(k,r)).catch(()=>{})}
function shareCell(k,r){const c=S.collab.find(x=>x.id===k+'_'+r.id),q=`'${k}','${r.id}'`;
 if(r.shared&&(c||!LOADED.collab))return `<span class="tag ok">${c&&c.stage==='progress'?'In progress':c?'Proposal':'Shared'}</span><div style="margin-top:6px"><button class="btn ghost sm" onclick="unshareRow(${q})">Unshare</button></div>`;
 return `<button class="btn ghost sm" onclick="shareRow(${q})">Share</button>`}
async function shareRow(k,id){const r=S[k].find(x=>x.id===id);if(!r)return;
 if(!confirm('Share this with the whole team?\n\nA summary panel will appear in the Collaboration Space (Collab tab) as a proposal. Only the admin can approve it.'))return;
 try{await db.doc('collab/'+k+'_'+id).set({...collabData(k,r),stage:'proposal',sharedAt:new Date().toISOString(),approvedBy:'',approvedAt:''});
  r.shared=true;await db.doc(k+'/'+id).set({shared:true},{merge:true});render();toast('Shared. It is now a proposal in the Collaboration Space.','View',()=>{go('notes');scrollTo(0,0)})}catch(e){alert('Could not share: '+e.message)}}
async function unshareRow(k,id){const c=S.collab.find(x=>x.id===k+'_'+id);
 if(!confirm(c&&c.stage==='progress'?'This is already approved and in progress. Remove it from the Collaboration Space?':'Remove this from the Collaboration Space?'))return;
 try{await db.doc('collab/'+k+'_'+id).delete();const r=S[k].find(x=>x.id===id);if(r)r.shared=false;await db.doc(k+'/'+id).set({shared:false},{merge:true});toast('Removed from the Collaboration Space.');render()}catch(e){alert('Could not unshare: '+e.message)}}
function approveCollab(id){if(!isApprover())return;const now=new Date().toISOString();
 db.doc('collab/'+id).update({stage:'progress',approvedBy:myName(),approvedAt:now}).then(()=>toast('Approved. Moved to progress mode.')).catch(e=>alert('Could not approve: '+e.message))}
function backToProposal(id){if(!isApprover())return;if(!confirm('Move this back to the proposal stage?'))return;
 db.doc('collab/'+id).update({stage:'proposal',approvedBy:'',approvedAt:''}).catch(e=>alert('Could not save: '+e.message))}

const openEmb={};
const safeUrl=u=>{u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const embUrl=u=>{try{const x=new URL(u),hn=x.hostname.replace(/^www\./,'');
 if(hn==='youtube.com'&&x.pathname==='/watch'&&x.searchParams.get('v'))return 'https://www.youtube.com/embed/'+encodeURIComponent(x.searchParams.get('v'));
 if(hn==='youtu.be'&&x.pathname.length>1)return 'https://www.youtube.com/embed/'+encodeURIComponent(x.pathname.slice(1));
 if(hn==='drive.google.com'||hn==='docs.google.com')return u.replace(/\/(view|edit)([?#].*)?$/,'/preview');
 return u}catch(e){return u}};

 rows.forEach((d,r)=>{const row=ws.getRow(5+r);cols.forEach((col,i)=>{const x=row.getCell(i+1),v=d[i];if(v!==undefined&&v!=='')x.value=v;x.font={size:11,color:{argb:XC.tx}};x.border=BORD;x.alignment={vertical:'top',wrapText:true,horizontal:col.t==='num'?'right':'left',indent:col.t==='num'?0:1};if(col.t==='num')x.numFmt=col.f||'0.00';if(r%2)x.fill=solid(XC.zb)})});
 if(sumCols&&rows.length){const tr=ws.getRow(5+rows.length),last=4+rows.length;cols.forEach((col,i)=>{const x=tr.getCell(i+1);x.fill=solid(XC.tot);x.font={bold:true,size:11,color:{argb:XC.tx}};x.border={top:{style:'medium',color:{argb:XC.pk}},bottom:bd,left:bd,right:bd}});tr.getCell(1).value='Total';tr.getCell(1).alignment={indent:1};

 if(rows.length)ws.autoFilter={from:{row:4,column:1},to:{row:4+rows.length,column:n}};return ws}
const wkStart=ds=>{const [y,m,d]=ds.split('-').map(Number),t=new Date(Date.UTC(y,m-1,d));t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return t.toISOString().slice(0,10)};
const wkLbl=w=>{const a=new Date(w+'T00:00:00Z'),b=new Date(a);b.setUTCDate(b.getUTCDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});return f(a)+' – '+f(b)+', '+b.getUTCFullYear()};

 const cols=(wk?[{h:'Week (Mon to Sun)',w:26}]:[]).concat([{h:'Name',w:26},{h:'Days present',w:14,t:'num',f:'0'},{h:'Records',w:11,t:'num',f:'0'},{h:'Total hours',w:13,t:'num'},{h:'Avg hours / day',w:15,t:'num'},{h:'Still clocked in',w:15,t:'num',f:'0'}]),off=wk?1:0;

const rulesTxt=()=>{const f=a=>a.map(e=>"        '"+e+"'").join(",\n"),em=f(ADMIN_EMAILS),ap=f(APPROVER_EMAILS);return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function verified() { return signedIn() && request.auth.token.email_verified == true; }
    function isAdmin() {
      return verified() && request.auth.token.email.lower() in [
${em}
      ];
    }

    // Only these four can approve in the Collaboration Space.
    function isApprover() {
      return verified() && request.auth.token.email.lower() in [
${ap}
      ];
    }

    match /employees/{id} {
      allow get: if signedIn();
      allow list: if isAdmin() || (signedIn() && resource.data.uid == request.auth.uid);
      allow create: if isAdmin();
      allow update: if isAdmin()
        || (signedIn()
            && resource.data.get('uid', '') == ''
            && request.resource.data.uid == request.auth.uid
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['uid', 'email', 'claimedAt'])
            && (resource.data.get('invite', '') == ''
                || resource.data.get('invite', '') == request.auth.token.email.lower()))
        || (signedIn()
            && resource.data.get('uid', '') == request.auth.uid
            && request.resource.data.uid == ''
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['uid', 'email']));
      allow delete: if isAdmin();
    }

    match /users/{uid} {
      allow read: if request.auth.uid == uid || isAdmin();
      allow create: if request.auth.uid == uid && verified();
      allow update: if request.auth.uid == uid || isAdmin();
      allow delete: if isAdmin();
    }

    // Planner: private. Only the owner can read their own rows.
    match /plan/{id} {
      allow read: if signedIn() && resource.data.uid == request.auth.uid;
      allow create: if verified() && (isAdmin() || request.resource.data.uid == request.auth.uid);
      allow update: if isAdmin()
        || (verified() && resource.data.uid == request.auth.uid && request.resource.data.uid == resource.data.uid);
      allow delete: if isAdmin() || (verified() && resource.data.uid == request.auth.uid);
    }

    // Ice Whispers: private. Only the owner can read their own rows.
    match /ice/{id} {
      allow read: if signedIn() && resource.data.uid == request.auth.uid;
      allow create: if verified() && (isAdmin() || request.resource.data.uid == request.auth.uid);
      allow update: if isAdmin()
        || (verified() && resource.data.uid == request.auth.uid && request.resource.data.uid == resource.data.uid);
      allow delete: if isAdmin() || (verified() && resource.data.uid == request.auth.uid);
    }

    // Collaboration Space: rows people chose to share. Everyone verified can read.
    // ONLY approvers (Ms Tracy, Josie + the two contact@ emails) can change the stage or remove others' shares.
    match /collab/{id} {
      allow read: if verified();
      allow create: if verified()
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.stage == 'proposal';
      allow update: if isApprover()
        || (verified()
            && resource.data.uid == request.auth.uid
            && request.resource.data.uid == resource.data.uid
            && request.resource.data.stage == resource.data.stage
            && request.resource.data.approvedBy == resource.data.approvedBy
            && request.resource.data.approvedAt == resource.data.approvedAt);
      allow delete: if isApprover() || (verified() && resource.data.uid == request.auth.uid);
    }

    match /notes/{id} {
      allow read: if verified();
      allow create: if verified() && request.resource.data.uid == request.auth.uid;
      allow update: if false;
      allow delete: if isAdmin() || (verified() && resource.data.uid == request.auth.uid);
    }

    match /attendance/{id} {
      allow read: if isAdmin() || (signedIn() && resource.data.uid == request.auth.uid);
      allow create: if verified() && request.resource.data.uid == request.auth.uid;
      allow update: if isAdmin()
        || (verified()
            && resource.data.uid == request.auth.uid
            && resource.data.out == ''
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['out', 'outTz']));
      allow delete: if isAdmin();
    }
  }
}`};

/* Edit an Employee ID record (ID, name, department, reserved email). Admin emails only; firestore.rules must also allow it. */
async function editEmp(id){if(!isAdmin())return;const e=S.emps.find(x=>x.id===id);if(!e)return;
 const nid=prompt('Employee ID (letters and numbers, 8 to 20 characters)',e.id);if(nid===null)return;
 const nm=prompt('Name',e.name||'');if(nm===null)return;
 const dp=prompt('Department code ('+DEPTS.map(d=>d[0]+' = '+d[1]).join(', ')+')',e.dept||'');if(dp===null)return;
 let inv=e.invite||'';
 if(!e.uid){const em=prompt('Reserved email (leave empty for none)',inv);if(em===null)return;inv=em.trim().toLowerCase();if(inv&&!/^\S+@\S+\.\S+$/.test(inv))return alert('That email doesn’t look right.')}
 const newId=nid.toUpperCase().replace(/\s+/g,''),name=nm.trim(),dept=dp.trim();
 if(!/^[A-Z0-9]{8,20}$/.test(newId))return alert('The Employee ID must be 8 to 20 letters or numbers.');
 if(!name)return alert('Please enter a name.');
 if(!DEPTS.some(d=>d[0]===dept))return alert('Unknown department code.');
 if(newId!==id&&!confirm('Change '+id+' to '+newId+'? '+(e.uid?'This person must use the new ID the next time they sign in.':'Anyone holding the old ID must use the new one.')))return;
 try{await db.runTransaction(async t=>{const oldRef=db.doc('employees/'+id),newRef=db.doc('employees/'+newId);
   const s=await t.get(oldRef);if(!s.exists)throw 'This record no longer exists.';
   let taken=false;if(newId!==id){taken=(await t.get(newRef)).exists}
   if(taken)throw 'That Employee ID is already used.';
   const m=newId.match(/^[A-Z]{3}(\d{4})/),d=Object.assign({},s.data(),{name,dept,invite:inv,year:m?m[1]:(s.data().year||'')});
   if(newId===id)t.update(oldRef,{name:d.name,dept:d.dept,invite:d.invite,year:d.year});
   else{t.set(newRef,d);t.delete(oldRef)}})}
 catch(x){alert(typeof x==='string'?x:'Could not save: '+(x&&x.message||x))}}

function addSheet(wb,k,tpl){
 const att=isAtt(k),name=att?'Attendance':SETS[k].label,cols=colsFor(k),rows=tpl?[]:rowsFor(k),n=cols.length,total=tpl?60:att?rows.length:Math.max(rows.length,15);
 const title='TSwede Biz  ·  '+name+(tpl?'  ·  Template':'');
 const subt=tpl?'Fill in from row 5  ·  Dates like 2026-11-07 or real Excel dates  ·  Use the dropdowns  ·  Upload this file back with “Upload Excel”':'Exported '+today()+'  ·  Times shown in '+TZ+(k==='mine'?'  ·  '+myName():k==='att'?'  ·  '+attMonth:att?'':'  ·  '+myName());
 const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:4,showGridLines:false}],properties:{tabColor:{argb:XC.pk}},pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9}});
 ws.columns=cols.map(c=>({width:c.w}));
 for(let i=1;i<=n;i++){const a=ws.getCell(1,i);a.fill=solid(XC.dk);a.border={bottom:{style:'medium',color:{argb:XC.gd}}};const b=ws.getCell(2,i);b.fill=solid(XC.zb)}
 ws.mergeCells(1,1,1,n);ws.mergeCells(2,1,2,n);
 let c=ws.getCell(1,1);c.value=title;c.font={name:'Georgia',size:20,bold:true,color:{argb:XC.wh}};c.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(1).height=44;
 c=ws.getCell(2,1);c.value=subt;c.font={size:10,italic:true,color:{argb:XC.mu}};c.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(2).height=24;
 ws.getRow(3).height=6;
 const hr=ws.getRow(4);hr.height=30;
 cols.forEach((col,i)=>{const x=hr.getCell(i+1);x.value=col.h;x.font={bold:true,size:11,color:{argb:XC.wh}};x.fill=solid(XC.pk);x.alignment={vertical:'middle',horizontal:col.t==='num'?'right':'left',indent:1};x.border=BORD});
 for(let r=0;r<total;r++){const row=ws.getRow(5+r),d=rows[r]||[];

  cols.forEach((col,i)=>{const x=tr.getCell(i+1);x.fill=solid(XC.tot);x.font={bold:true,size:11,color:{argb:XC.tx}};x.border={top:{style:'medium',color:{argb:XC.pk}},bottom:bd,left:bd,right:bd}});

 ws.autoFilter={from:{row:4,column:1},to:{row:4+Math.max(total,1),column:n}};
 return ws}

/* ---------- import ---------- */
function pick(k){imp=k;$('#file').click()}
function nd(v){if(typeof v==='number'&&isFinite(v)&&v>20000&&XLSX.SSF&&XLSX.SSF.parse_date_code){const p=XLSX.SSF.parse_date_code(v);if(p)return p.y+'-'+pad(p.m)+'-'+pad(p.d)}if(v instanceof Date){return new Date(v.getTime()+432e5).toISOString().slice(0,10)}v=String(v??'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);const d=new Date(v);return isNaN(d)?'':iso(d)}
async function batchRun(list){for(let i=0;i<list.length;i+=400){const b=db.batch();list.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const wb=/\.csv$/i.test(f.name)?XLSX.read(await f.text(),{type:'string'}):XLSX.read(await f.arrayBuffer(),{type:'array'});
  const S_=SETS[imp],N=s=>String(s??'').toLowerCase().replace(/[^a-z]/g,''),names=c=>[N(c[1]),N(c[0]),...(c[4]||[])];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
  /* the styled template has a title banner above the header, so look for the header row */
  const hi=aoa.findIndex(r=>S_.cols.filter(c=>r.some(x=>names(c).includes(N(x)))).length>=2);
  if(hi<0){alert('No matching columns found. Use the Excel template button for the right column names.');return}
  const hd=aoa[hi];
  const out=aoa.slice(hi+1).map(row=>{const r={};
   S_.cols.forEach(c=>{const ix=hd.findIndex(x=>names(c).includes(N(x)));let v=ix<0?'':(row[ix]??'');v=c[2]==='date'?nd(v):String(v).trim();if(c[2]==='sel'&&!v)v=c[3][0];r[c[0]]=v});return r})
   .filter(r=>S_.cols.some(c=>c[2]!=='sel'&&c[0]!=='date'&&r[c[0]])||r.date);
  if(!out.length){alert('No rows found under the header. Add some rows and try again.');return}
  const cur=S[imp].filter(own),rep=cur.length?confirm('Replace this '+S_.label+' list with this file?\n\nOK = Replace   Cancel = Add to existing'):false;
  const ops=[];if(rep){cur.forEach(r=>ops.push(b=>b.delete(db.doc(imp+'/'+r.id))));await Promise.all(cur.filter(r=>r.shared).map(r=>db.doc('collab/'+imp+'_'+r.id).delete().catch(()=>{})))}
  out.forEach(r=>ops.push(b=>b.set(db.collection(imp).doc(),{...r,uid:user.uid,by:myName(),upd:new Date().toISOString()})));
  await batchRun(ops);
  const d=out.find(r=>r.date);if(d){cy=+d.date.slice(0,4);cm=+d.date.slice(5,7)-1}sel=null;render();
 }catch(err){alert('Sorry, that file could not be read or saved.')}
 e.target.value=''};

/* ---------- start ---------- */
{const t=LS.get('tsw_theme','');if(t)document.documentElement.dataset.theme=t}
render();
if(CONFIGURED)loadFb().then(ok=>{if(!ok){FBFAIL=true;render();return}firebase.initializeApp(CFG);fa=firebase.auth();db=firebase.firestore();fa.onAuthStateChanged(u=>{if(!gate)boot(u)})});
</script>
</body>
